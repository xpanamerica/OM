# 本机 Beta：用户站 :8080、管理端 :8081
# - 静态 SPA + 同源反代 /api/v1（即对外「API」路径；后端 OpenAPI 前缀一致）
# - /health、/docs、/redoc、/openapi.json 便于内测验收（可按需在 compose 环境关闭后端文档）
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    # 须 >= 后端 ``MAX_VIDEO_SIZE_MB`` / ``MAX_ATTACHMENT_SIZE_MB``（附件经本反代 POST 至 API）
    client_max_body_size 2048m;
    # 大附件慢上行时避免默认 60s 中断（与下方 proxy_*_timeout 对齐）
    client_body_timeout 7200s;

    # 反代到 api 容器（compose 服务名）
    upstream beta_api {
        server api:8000;
        keepalive 32;
    }

    # Cloudflare Tunnel / 其它 HTTPS 反代通常会把外部协议放在 X-Forwarded-Proto。
    # 若这里无条件写成 $scheme，Tunnel → 本机 Nginx 的 HTTP 会让后端签发 http:// 播放 URL，
    # HTTPS 页面会因 mixed content 无法播放本机成片。
    map $http_x_forwarded_proto $om_forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html/user;
        index index.html;

        # 浏览器 / 前端使用的 API 前缀（勿将 Postgres/Redis 暴露到外网，仅反代此路径）
        location /api/v1/ {
            proxy_pass http://beta_api/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $om_forwarded_proto;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
        }

        location = /health {
            proxy_pass http://beta_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $om_forwarded_proto;
        }

        location /docs {
            proxy_pass http://beta_api/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $om_forwarded_proto;
        }

        location /redoc {
            proxy_pass http://beta_api/redoc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $om_forwarded_proto;
        }

        location = /openapi.json {
            proxy_pass http://beta_api/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
        }

        # SPA 入口：避免浏览器长期缓存旧 index 导致仍加载含阿里云直传逻辑的旧 JS
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    server {
        listen 8081;
        server_name _;
        root /usr/share/nginx/html/admin;
        index index.html;

        location /api/v1/ {
            proxy_pass http://beta_api/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $om_forwarded_proto;
            proxy_request_buffering off;
            proxy_connect_timeout 60s;
            proxy_send_timeout 7200s;
            proxy_read_timeout 7200s;
        }

        location = /health {
            proxy_pass http://beta_api/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $om_forwarded_proto;
        }

        location /docs {
            proxy_pass http://beta_api/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $om_forwarded_proto;
        }

        location /redoc {
            proxy_pass http://beta_api/redoc;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $om_forwarded_proto;
        }

        location = /openapi.json {
            proxy_pass http://beta_api/openapi.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $om_forwarded_proto;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
