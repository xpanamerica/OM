【数据库实体与要点】
1. users：含 is_active、is_superuser、deleted_at（软删）、时间戳
2. categories：sort_order、is_active、时间戳
3. tags：sort_order、is_active、时间戳
4. videos：状态、作者、分类（ON DELETE SET NULL）、审核备注、reviewed_by_id、submitted_at、published_at、first_published_at、offline_at、计数列
5. video_tags
6. comments：软删 is_deleted、deleted_at
7. likes：UNIQUE(video_id, user_id)
8. favorites：UNIQUE(video_id, user_id)
9. play_history：UNIQUE(video_id, user_id)，进度与时间
10. audit_logs

【接口范围】（前缀均为 /api/v1）
Auth:
- POST /auth/register
- POST /auth/login
- GET /auth/me

Users:
- GET /users/me
- PATCH /users/me
- GET /users/me/history

Categories:
- GET /categories（支持 ?include_inactive=true，仅管理员有效）
- POST /categories
- PATCH /categories/{id}
- DELETE /categories/{id}

Tags:
- GET /tags（支持 ?include_inactive=true，仅管理员有效）
- POST /tags
- PATCH /tags/{id}
- DELETE /tags/{id}

Videos:
- GET /videos
- GET /videos/{id}
- POST /videos
- PATCH /videos/{id}
- POST /videos/{id}/submit-review
- POST /videos/{id}/publish
- POST /videos/{id}/reject
- POST /videos/{id}/offline

Comments:
- GET /videos/{id}/comments
- POST /videos/{id}/comments
- DELETE /comments/{id}

Interactions:
- POST /videos/{id}/like
- DELETE /videos/{id}/like
- POST /videos/{id}/favorite
- DELETE /videos/{id}/favorite
- POST /videos/{id}/play-history

Admin:
- GET /admin/health（管理员，DB + Redis）

Stats:
- GET /stats/dashboard

