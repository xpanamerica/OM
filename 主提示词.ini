你现在是一个资深 Python FastAPI 后端工程师和架构师。
我正在开发一个“视频知识平台”的后端 MVP，请你严格按下面要求完成，不允许偷懒，不允许输出伪代码。

【总体目标】
创建一个可运行的后端项目，支持：
1. 用户注册/登录/JWT鉴权（含软删用户不可登录）
2. 管理员权限（is_superuser + 依赖注入）
3. 视频管理（标题、简介、封面、视频URL、状态流转与审核时间线）
4. 分类、标签（启用/排序；公开默认仅见启用项）
5. 评论、点赞、收藏、播放记录
6. 基础统计与管理端健康检查
7. OpenAPI 文档
8. Docker 本地运行
9. PostgreSQL + Redis
10. Alembic migration（含约束与索引演进，可分多次 revision）
11. pytest（unit / integration 分层）

【技术栈】
- Python 3.11
- FastAPI
- SQLAlchemy 2.x
- Pydantic v2
- PostgreSQL
- Redis
- Alembic
- pytest
- Docker Compose

【硬性要求】
1. 代码必须可运行，不要伪代码。
2. 先输出完整目录结构，再逐文件生成（或按《分阶段提示词.ini》分阶段执行）。
3. 项目分层：api / schemas/v1 / models / repositories / services / mappers / core / db / infrastructure；路由在 api/v1/routes/，由 api/v1/router.py 汇总。
4. 所有接口必须使用 Pydantic schema 校验（契约放在 app/schemas/v1/）。
5. 所有数据库修改必须带 Alembic migration。
6. 必须带 `.env.example`、`requirements.txt`、`Dockerfile`、`docker-compose.yml`、`README.md`。
7. 所有鉴权使用 JWT Bearer。
8. 所有需要管理员权限的接口，必须通过依赖注入校验。
9. 评论先只做一级评论；删除为软删除（is_deleted + deleted_at）。
10. 视频必须支持状态流转：draft / pending_review / published / rejected / offline；允许 draft|rejected|offline → pending_review；published → offline；pending_review → publish|reject。
11. 只允许公开展示 `published` 状态的视频（列表与详情）；互动仅针对 published。
12. 同一用户对同一视频只能点赞一次、收藏一次（DB 唯一约束）。
13. 播放记录：每用户每视频一条（唯一），记录 progress_seconds 与 last_played_at，可 upsert。
14. 写测试：至少覆盖 auth、videos、comments、permissions；测试放在 tests/unit/ 与 tests/integration/。
15. 使用 UUID 作为主键。
16. 所有时间字段使用 timezone-aware datetime。
17. API 路由统一前缀 `/api/v1`。
18. 输出时禁止省略任何关键文件内容（分阶段生成时每一阶段遵守同样纪律）。

【推荐执行方式】
- 非专业开发者或希望减少返工时：不要一次性生成全仓，请严格按同目录下《分阶段提示词.ini》从阶段 0 依次执行，每阶段验收通过后再继续。
- 若仍采用本文件「第 1～7 步」粗粒度，则每一步对应多阶段合并，须在对话中自行拆小并每步验收。

