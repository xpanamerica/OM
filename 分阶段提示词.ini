# Cursor 分阶段提示词（与《主提示词》《稳妥开发顺序》对齐）

使用说明（非专业开发者）：
- 每一阶段单独新开一轮 Cursor 对话，只粘贴该阶段的「执行块」。
- 上一阶段「验收标准」未通过，不要进入下一阶段。
- 路径以 `backend/` 为项目根；路由在 `app/api/v1/routes/`，汇总为 `app/api/v1/router.py`；契约为 `app/schemas/v1/`；DTO 映射为 `app/mappers/`；Redis/观测为 `app/infrastructure/`。
- 详细架构约定见仓库内 `backend/docs/architecture.md`。

================================================================================
阶段 0：工程骨架与质量闸门（不可跳过）
================================================================================
目标：仓库可复现、依赖可安装、忽略规则与文档入口齐全。

应生成/维护：
- backend/requirements.txt（或 pyproject.toml，二选一并写清）
- backend/.env.example
- backend/.gitignore
- backend/Makefile（可选但推荐）
- backend/README.md 中「从零到可开发」最小命令清单

验收：`pip install -r requirements.txt`（或等价）无报错；README 中命令可复制执行。

================================================================================
阶段 1：配置、日志、异常、应用入口（不可跳过）
================================================================================
目标：应用能启动；配置从环境读取；全局异常与日志策略就位。

应生成：
- app/core/config.py、exceptions.py、logging.py、pagination.py（pagination 可先空实现）
- app/main.py（最小 FastAPI，可挂 /docs）
- app/__init__.py

验收：`python -c "from app.main import app"` 无报错；启动后访问 /docs 不 500。

================================================================================
阶段 2：数据库连接、Session、健康检查（不可跳过）
================================================================================
目标：能连 PostgreSQL；生命周期内可创建 Session；健康检查可反映 DB。

应生成：
- app/db/base.py、session.py、init_db.py（init 可先仅占位）
- app/main.py 中 DB 健康逻辑（或独立 health）

验收：配置正确 DATABASE_URL 时健康检查为成功；错误 URL 时失败行为明确（非挂死）。

================================================================================
阶段 3：Alembic 链路（不可跳过）
================================================================================
目标：空库可 `alembic upgrade head`；迁移为 schema 真源。

应生成：
- alembic.ini、alembic/env.py、alembic/script.py.mako
- alembic/versions/（首迁可为仅建表前的占位或最小表，与阶段 4 可合并但须可 upgrade）

验收：新空库执行 upgrade 成功；模型变更后习惯用 revision + 人工检查 upgrade()。

================================================================================
阶段 4：用户模型 + users 表迁移（不可跳过）
================================================================================
目标：users 表与 ORM 一致（含 is_active、is_superuser、deleted_at、时间戳等已定稿字段）。

应生成：
- app/models/user.py
- alembic/versions/xxxx_users.py（或与阶段 3 合并为初始迁，二选一写清）
- tests/conftest.py 雏形（后续阶段持续用）

验收：迁移后 ORM 可插入并查询一条用户；无 JWT 也可。

================================================================================
阶段 5：安全、JWT、deps（不可跳过）
================================================================================
目标：密码哈希、JWT 签发/解析；OAuth2 Bearer；get_current_user / require_superuser。

应生成：
- app/core/security.py
- app/api/deps.py

验收：单元级可对假 subject 生成 token；无效 token 在依赖中失败。

================================================================================
阶段 6：注册 / 登录 / 当前用户 API + 测试（不可跳过）
================================================================================
目标：register、login、auth/me 或 users/me；user_repo 排除已软删用户；pytest 锁住行为。

应生成：
- app/repositories/user_repo.py
- app/services/auth_service.py、user_service.py（若 PATCH me 本阶段不做可下阶段）
- app/schemas/v1/auth.py、user.py、common.py
- app/api/v1/router.py、app/api/v1/routes/auth.py、routes/users.py（按现项目拆分）
- tests/unit/test_auth.py

验收：pytest 通过注册→登录→Bearer 访问 me；错误密码 401。

依赖：阶段 4～5。

================================================================================
阶段 7：分类 / 标签模型 + 迁移
================================================================================
目标：categories、tags 表（含 sort_order、is_active）；video_tags 若本阶段一起做则一并迁移。

应生成：
- app/models/category.py、tag.py、video_tag.py（若延后则阶段 9 与视频一起做）
- 对应 migration

验收：迁移成功；ORM 可插入 category/tag。

依赖：阶段 4（users 存在，若 audit 外键需要可后置）。

================================================================================
阶段 8：分类 / 标签 API（公开读、管理员写）
================================================================================
目标：category_service、tag_service；routes；schemas/v1；GET 默认仅 is_active=true；?include_inactive=true 仅管理员。

应生成：
- app/repositories/category_repo.py、tag_repo.py
- app/services/category_service.py、tag_service.py
- app/schemas/v1/category.py、tag.py
- app/api/v1/routes/categories.py、tags.py（并在 router.py 注册）

验收：未登录 GET 列表成功；非管理员写 403；管理员 CRUD 成功。

依赖：阶段 7。

================================================================================
阶段 9：视频模型 + video_tags + 迁移（含审核与时间字段）
================================================================================
目标：videos 表与已定稿字段一致（status、计数、reviewed_by_id、submitted_at、published_at、first_published_at、offline_at、category_id ON DELETE SET NULL 等）；迁移可与 PostgreSQL CHECK/索引分次提交以降低单次 diff。

应生成：
- app/models/video.py、video_tag.py（若阶段 7 未建）
- alembic/versions/xxxx_videos.py（及可能的 0002 类约束迁）

验收：迁移成功；可插入带 author、category、tag 关联的测试数据。

依赖：阶段 4、7。

================================================================================
阶段 10：视频只读 + 发布可见规则 + video_mapper（强烈建议不跳过）
================================================================================
目标：video_repo 列表/详情；video_service 仅读路径；仅 published 对匿名/普通用户；列表排序策略明确；mappers/video_mapper.py；schemas/v1/video.py。

应生成：
- app/mappers/video_mapper.py
- app/repositories/video_repo.py（读）
- app/services/video_service.py（读部分）
- app/api/v1/routes/videos.py（仅 GET）
- tests/integration/test_videos_read.py（或等价）

验收：公开列表仅 published；详情非 published 对普通用户 404；VideoOut 字段完整。

依赖：阶段 9、8。

================================================================================
阶段 11：视频写与状态机（管理员）+ 审计写入（强烈建议不跳过）
================================================================================
目标：创建/更新/ submit-review / publish / reject / offline；draft|rejected|offline→pending_review；publish 写 first_published_at 逻辑；offline_at；reviewed_by_id；admin_service.write_audit 挂钩。

应生成：
- app/services/video_service.py（写与状态机）
- app/services/admin_service.py（若尚未存在）
- app/api/v1/routes/videos.py（补全写路由）
- 必要迁移（CHECK、索引、外键，可拆子阶段）

验收：每条允许的状态边有测试或清单勾选；非法边 4xx；PG 上约束不拒绝合法数据。

依赖：阶段 10、5、6。

================================================================================
阶段 12：评论（一级、软删、deleted_at、comment_count）
================================================================================
目标：comment 模型与迁移；comment_repo、comment_service；routes/comments；测试。

应生成：
- app/models/comment.py、迁移
- app/repositories/comment_repo.py、app/services/comment_service.py
- app/schemas/v1/comment.py
- app/api/v1/routes/comments.py
- tests/integration/test_comments.py

验收：仅 published 可评；软删后 is_deleted + deleted_at；计数一致。

依赖：阶段 10～11。

================================================================================
阶段 13：点赞 / 收藏（唯一约束 + 计数）
================================================================================
目标：like、favorite 模型与迁移；interaction_service 或等价；routes/likes、favorites；测试重复操作。

应生成：
- app/models/like.py、favorite.py、迁移
- app/services/interaction_service.py（相关方法）
- app/api/v1/routes/likes.py、favorites.py

验收：同一用户同一视频第二次点赞/收藏失败；计数与事务一致。

依赖：阶段 10、12（评论可与点赞并行但建议先评论以控复杂度）。

================================================================================
阶段 14：播放记录（upsert + me/history）
================================================================================
目标：play_history 唯一 (user_id, video_id)；upsert；GET users/me/history。

应生成：
- app/models/play_history.py、迁移
- interaction_service 续写、routes/history.py、routes/users.py 中 history
- app/schemas/v1/history.py

验收：多次写入同一视频为更新；历史列表有数据。

依赖：阶段 10。

================================================================================
阶段 15：统计看板 + 权限测试
================================================================================
目标：stats_repo、stats_service、routes/stats；dashboard 指标与方案一致；test_permissions。

应生成：
- app/repositories/stats_repo.py、app/services/stats_service.py
- app/api/v1/routes/stats.py
- app/models/audit_log.py（若未在前序阶段加入）
- tests/unit/test_permissions.py

验收：管理员 dashboard 200；普通用户 403；pytest 通过。

依赖：阶段 6、9～14 中已有表数据。

================================================================================
阶段 16：Redis 封装、观测占位、Docker、文档收尾
================================================================================
目标：app/infrastructure/redis.py、observability 占位；**main 的 `GET /health` 与 `GET /api/v1/admin/health` 共用 `health_service.full_health_report`（含 database + redis + status）**；docker-compose、README、docs/runbooks、workers/README。

应生成/更新：
- app/infrastructure/redis.py、observability/metrics.py、tracing.py
- app/services/health_service.py、app/api/v1/routes/admin.py、app/main.py（根 `/health`）
- docker-compose.yml、Dockerfile、README.md、docs/architecture.md、docs/runbooks/migrations.md、workers/README.md

验收：`docker compose up --build` 起服务；README 含迁移、管理员、测试、docs；Redis 检查与文档一致。

依赖：阶段 2 起可并行准备，但「栈完整」本阶段收口。

================================================================================
绝对不能跳过的阶段摘要
================================================================================
0 → 1 → 2 → 3 → 4 → 5 → 6（骨架 + 库 + 迁移链 + 用户 + 鉴权闭环）

================================================================================
模块依赖（前置关系）
================================================================================
- routes → deps、schemas/v1、services（禁止 routes 直连 repositories 做业务）
- services → repositories、models、core；视频展示依赖 mappers/video_mapper
- repositories → models、session
- 分类/标签 → 视频写（绑定 category、tag）
- 视频只读规则 → 评论 / 点赞 / 收藏 / 播放（「仅 published 可互动」）
- stats → 依赖各业务表已有稳定写入

================================================================================
与《主提示词》的对应关系
================================================================================
主提示词中的「第 2～7 步」粗粒度对应：本文件阶段 0～16 的合并版。
细粒度执行请以本文件阶段为准，每阶段单独开对话、单独验收。

================================================================================
可复制：阶段 2 示例执行块（其余阶段按上表自拟「应生成」清单替换）
================================================================================

```text
继续阶段 2。
目标：数据库连接、Session、健康检查；不涉及业务表。
请先列出将创建或修改的文件路径，再给出每个文件完整内容。
完成后给出验收命令（例如：设置 DATABASE_URL 后如何验证 DB 连通）。
禁止本阶段引入 users/videos 等业务模型。
```
