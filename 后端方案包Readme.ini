## 核心业务规则
### 用户与权限
- 普通用户：浏览、评论、点赞、收藏、播放
- 管理员：创建/编辑/审核/下架视频，管理分类标签，查看统计
- 首个管理员通过环境变量初始化

### 视频状态机
- draft 草稿
- pending_review 待审核
- published 已发布
- rejected 已拒绝
- offline 已下架

状态流转（与实现一致）：
- 创建视频默认 `draft`
- 提交审核：`draft | rejected | offline -> pending_review`（自 offline 提交时清空 offline_at，写 submitted_at）
- 审核通过：`pending_review -> published`（写 published_at、reviewed_by_id；仅首次写 first_published_at）
- 审核拒绝：`pending_review -> rejected`（写 review_note、reviewed_by_id）
- 下架：`published -> offline`（写 offline_at、reviewed_by_id）
- 已下架可再次「提交审核」进入待审队列

### 评论规则
- 仅登录用户可评论
- 支持一级评论，MVP 暂不做多级回复
- 评论可软删除

### 点赞/收藏规则
- 同一用户对同一视频只能点赞一次
- 同一用户对同一视频只能收藏一次

### 播放记录
- 每次播放写入或更新最近一次时间
- 记录播放进度秒数

## 数据库表设计（简版）
### users
- id UUID PK
- email varchar unique nullable
- phone varchar unique nullable
- username varchar unique not null
- hashed_password varchar not null
- is_active bool default true
- is_superuser bool default false
- deleted_at timestamptz nullable（软删；登录与按 id 查询排除）
- created_at timestamptz
- updated_at timestamptz

### categories
- id UUID PK
- name varchar unique
- slug varchar unique
- description text nullable
- sort_order int default 0
- is_active bool default true
- created_at / updated_at

### tags
- id UUID PK
- name varchar unique
- slug varchar unique
- sort_order int default 0
- is_active bool default true
- created_at / updated_at

### videos
- id UUID PK
- title varchar not null
- slug varchar unique
- summary text nullable
- description text nullable
- cover_url varchar nullable
- video_url varchar nullable
- duration_seconds int default 0
- status varchar indexed
- author_id UUID FK users.id
- category_id UUID FK categories.id nullable ON DELETE SET NULL
- reviewed_by_id UUID FK users.id nullable
- review_note text nullable
- submitted_at timestamptz nullable
- published_at timestamptz nullable
- first_published_at timestamptz nullable
- offline_at timestamptz nullable
- view_count int default 0
- like_count int default 0
- favorite_count int default 0
- comment_count int default 0
- created_at / updated_at

### video_tags
- video_id UUID FK
- tag_id UUID FK
- PK(video_id, tag_id)

### comments
- id UUID PK
- video_id UUID FK
- user_id UUID FK
- content text not null
- is_deleted bool default false
- deleted_at timestamptz nullable
- created_at / updated_at

### likes
- id UUID PK
- video_id UUID FK
- user_id UUID FK
- created_at
- UNIQUE(video_id, user_id)

### favorites
- id UUID PK
- video_id UUID FK
- user_id UUID FK
- created_at
- UNIQUE(video_id, user_id)

### play_history
- id UUID PK
- video_id UUID FK
- user_id UUID FK
- progress_seconds int default 0
- last_played_at timestamptz
- created_at / updated_at
- UNIQUE(video_id, user_id)

### audit_logs
- id UUID PK
- actor_user_id UUID FK users.id
- target_type varchar
- target_id UUID
- action varchar
- detail jsonb nullable
- created_at timestamptz

## API 规划（MVP）
### Auth
- POST /api/v1/auth/register
- POST /api/v1/auth/login
- GET /api/v1/auth/me

### Users
- GET /api/v1/users/me
- PATCH /api/v1/users/me
- GET /api/v1/users/me/history

### Categories
- GET /api/v1/categories（支持 ?include_inactive=true，仅管理员有效）
- POST /api/v1/categories
- PATCH /api/v1/categories/{id}
- DELETE /api/v1/categories/{id}

### Tags
- GET /api/v1/tags（支持 ?include_inactive=true，仅管理员有效）
- POST /api/v1/tags
- PATCH /api/v1/tags/{id}
- DELETE /api/v1/tags/{id}

### Videos
- GET /api/v1/videos
- GET /api/v1/videos/{id}
- POST /api/v1/videos
- PATCH /api/v1/videos/{id}
- POST /api/v1/videos/{id}/submit-review
- POST /api/v1/videos/{id}/publish
- POST /api/v1/videos/{id}/reject
- POST /api/v1/videos/{id}/offline

### Comments
- GET /api/v1/videos/{id}/comments
- POST /api/v1/videos/{id}/comments
- DELETE /api/v1/comments/{id}

### Interactions
- POST /api/v1/videos/{id}/like
- DELETE /api/v1/videos/{id}/like
- POST /api/v1/videos/{id}/favorite
- DELETE /api/v1/videos/{id}/favorite
- POST /api/v1/videos/{id}/play-history

### Admin
- GET /api/v1/admin/health（管理员；DB + Redis）

### Stats
- GET /api/v1/stats/dashboard

## 开发顺序（稳妥版；与《分阶段提示词.ini》阶段号对应）
0. 工程骨架与质量闸门（依赖、gitignore、README 命令清单）
1. 配置、日志、异常、应用入口
2. 数据库连接、Session、健康检查
3. Alembic 链路（空库可 upgrade）
4. 用户模型 + users 迁移
5. 安全、JWT、deps
6. 注册/登录/me API + unit 测试（不可跳过闭环）
7. 分类/标签模型 + 迁移
8. 分类/标签 service + routes（公开读、管理员写、include_inactive）
9. 视频模型 + video_tags + 迁移（含审核时间线字段）
10. 视频只读 + published 规则 + video_mapper + integration 测
11. 视频写与状态机 + 审计 + 约束/索引迁移（可拆子阶段）
12. 评论（一级、软删、deleted_at、计数）
13. 点赞/收藏（唯一约束、计数）
14. 播放记录（upsert、me/history）
15. 统计看板 + 权限测试
16. Redis 封装、观测占位、Docker、文档与 workers 说明

## Cursor执行纪律
- 默认按《分阶段提示词.ini》一次一个阶段执行；每阶段验收通过再开下一阶段
- 每次先列出将创建/修改的文件，再输出完整可运行内容，禁止伪代码
- 每步结束后：pytest 或 import/启动检查（该阶段承诺的最小验证）
- 不允许未经说明擅自重构整个项目或跨阶段大合并
- 所有数据库变更必须配 Alembic migration（PostgreSQL 上 CHECK/外键 ON DELETE 等与 docs/runbooks 一致）
- 路由层禁止直连 repository 写业务；契约统一在 schemas/v1/

## 第一轮验收标准
- `docker compose up --build` 能跑起来
- `/docs` 可打开
- 可以注册、登录、获取当前用户（Docker 默认首个管理员账号/密码以 `backend/docker-compose.yml` 为准，勿再写 admin/changeme）
- 管理员可创建分类、标签、视频
- 普通用户可浏览已发布视频
- 普通用户可评论/点赞/收藏/写入播放记录
- pytest 通过核心测试