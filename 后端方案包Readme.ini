# 视频知识平台后端 0→1 方案（Cursor执行版）

执行粒度：与仓库同目录《分阶段提示词.ini》中阶段 0～16 对齐；本文件提供业务全景与粗粒度清单。

## 目标
为一个中国市场的视频知识/科普平台搭建第一版可上线后端（MVP），支持：
- 用户注册/登录/JWT鉴权
- 管理员权限
- 视频内容管理（先用URL/封面/元数据，上传能力后接云）
- 分类、标签
- 评论、点赞、收藏、播放记录
- 内容审核状态流转
- 基础统计
- OpenAPI 文档
- Docker 本地开发
- PostgreSQL + Redis
- Alembic 迁移
- pytest 基础测试

## 技术栈
- Python 3.11
- FastAPI
- SQLAlchemy 2.x
- Pydantic v2
- PostgreSQL
- Redis
- Alembic
- PyJWT / python-jose
- pytest
- Docker Compose

